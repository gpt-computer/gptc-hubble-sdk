[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gptc-hubble-sdk"
version = "0.10.0"
description = "SDK for Hubble API at GPT::C0MPUTΞR."
authors = [{ name = "GPT::C0MPUTΞR", email = "info@khulnasoft.com" }]
license = { text = "Apache 2.0" }
requires-python = ">=3.7.0"
dependencies = [
    "requests",
    "aiohttp",
    "rich",
    "importlib-metadata",
    "filelock",
    "pathspec",
    "docker",
    "pyyaml",
    "python-jose",
    "setuptools<80",
]

[project.scripts]
gptc-auth = "hubble.__main__:main"
gptc-hub = "hubble.executor.__main__:main"
docker-credential-gptc-hubble = "hubble.dockerauth:main"

[project.urls]
Source = "https://github.com/gpt-computer/gptc-hubble-sdk/"
Tracker = "https://github.com/gpt-computer/gptc-hubble-sdk/issues"

[dependency-groups]
dev = [
    "black==26.10.1",
    "flake8==7.4.1",
    "isort==9.0.2",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "pytest-cov==7.1.0",
    "pytest-mock==3.17.0",
    "mock==5.2.0",
    "pre-commit",
]
[tool.uv.sources]
gptc = { git = "https://github.com/gpt-computer/serve" }

[tool.black]
line-length = 88
skip-string-normalization = true

[tool.isort]
profile = "black"
skip_gitignore = true
src_paths = ["api"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
