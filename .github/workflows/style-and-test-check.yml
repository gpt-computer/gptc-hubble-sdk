name: Style and test check

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: style-and-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  style-lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install requirements
        run: make init

      - name: Lint with flake8, black and isort
        run: make style

      - name: Run tests
        run: make test
        env:
          GPTC_AUTH_TOKEN: ${{ secrets.GPTC_AUTH_TOKEN }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: true

  install-gptc-ecosystem-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: style-lint-test
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Prepare environment
        run: |
          python -m pip install --upgrade pip wheel
          DOCARRAY_VERSION=$(curl --fail --location --silent "https://pypi.org/pypi/docarray/json" | jq -r '.releases | keys[] | select(startswith("0.2"))' | sort -V | tail -1)
          JCLOUD_VERSION=$(curl --fail --location --silent "https://pypi.org/pypi/jcloud/json" | jq -r '.releases | keys[] | select(startswith("0."))' | sort -V | tail -1)
          test -n "$DOCARRAY_VERSION"
          test -n "$JCLOUD_VERSION"
          python -m pip install "." "jcloud==$JCLOUD_VERSION" "docarray==$DOCARRAY_VERSION" "gptc @ git+https://github.com/gpt-computer/serve"

      - name: Test basic import
        run: python -c 'from gptc import Executor, requests'

      - name: Test imports
        run: |
          python -c 'from gptc import *'
          python -c 'from hubble import *'
          python -c 'from docarray import *'